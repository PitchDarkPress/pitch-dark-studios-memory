<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pitch Dark Studios — Command</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:     #0a0806;
    --dark:   #111009;
    --panel:  #13110d;
    --border: #2a2419;
    --ink:    #e8e0d0;
    --ink2:   #b0a090;
    --ink3:   #706050;
    --gold:   #c9923a;
    --gold2:  #e8b060;
    --rule:   #221709;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Courier Prime', monospace;
    min-height: 100vh;
    padding: 40px 32px;
  }

  header {
    display: flex;
    align-items: baseline;
    gap: 24px;
    margin-bottom: 48px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--border);
    justify-content: space-between;
  }

  h1 {
    font-family: 'Playfair Display', serif;
    font-weight: 900;
    font-size: 2rem;
    color: var(--gold);
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .tagline {
    font-size: 0.75rem;
    color: var(--ink3);
    letter-spacing: 0.25em;
    text-transform: uppercase;
  }

  .sections {
    display: flex;
    flex-direction: column;
    gap: 48px;
  }

  .section-title {
    font-size: 0.7rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 16px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--rule);
  }

  .links {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }

  .link-card {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 16px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 3px;
    text-decoration: none;
    color: var(--ink2);
    font-family: 'Courier Prime', monospace;
    font-size: 0.85rem;
    letter-spacing: 0.05em;
    cursor: pointer;
    transition: all 0.15s ease;
    user-select: none;
    position: relative;
  }

  .link-card:hover {
    border-color: var(--gold);
    color: var(--gold);
    background: #18120d;
  }

  .link-card.coming-soon {
    opacity: 0.4;
    cursor: default;
    pointer-events: none;
  }

  .link-card .icon {
    font-size: 1rem;
    flex-shrink: 0;
  }

  .link-card .label { white-space: nowrap; }

  .link-card .coming {
    font-size: 0.6rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--ink3);
    margin-left: 4px;
  }

  /* Drag handles */
  .link-card.dragging {
    opacity: 0.4;
    border-color: var(--gold);
  }

  .link-card.drag-over {
    border-color: var(--gold2);
    background: #1a1208;
  }

  .drag-handle {
    font-size: 0.7rem;
    color: var(--ink3);
    cursor: grab;
    padding-right: 4px;
    opacity: 0;
    transition: opacity 0.15s;
  }

  .link-card:hover .drag-handle { opacity: 1; }

  footer {
    margin-top: 60px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
    font-size: 0.7rem;
    color: var(--ink3);
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }
</style>
</head>
<body>

<header>
  <div style="display:flex;align-items:baseline;gap:24px;">
    <h1>Pitch Dark Studios</h1>
    <div class="tagline">Command — Publish and Be Damned</div>
  </div>
  <a href="./index.html" style="padding:6px 16px;border:1px solid var(--border);color:var(--ink2);font-family:'Courier Prime',monospace;font-size:0.75rem;letter-spacing:0.15em;text-transform:uppercase;text-decoration:none;transition:all 0.15s;" onmouseover="this.style.borderColor='var(--gold)';this.style.color='var(--gold)'" onmouseout="this.style.borderColor='var(--border)';this.style.color='var(--ink2)'">⬡ Database</a>
</header>

<div class="sections" id="sections"></div>

<footer>A Pitch Dark Studios imprint. Built as a Proauthorist project. Declared, as always.</footer>

<script>
const DEFAULT_SECTIONS = [
  {
    id: 'work',
    title: 'Work',
    links: [
      { id: 'pds',      icon: '◈', label: 'Pitch Dark Studios',   url: null },
      { id: 'pdp',      icon: '◈', label: 'Pitch Dark Press',      url: 'https://www.pitchdarkpress.com/' },
      { id: 'inkysite', icon: '◈', label: 'InkySwot — Site',       url: 'https://www.inkyswot.com/' },
      { id: 'inkyapp',  icon: '◈', label: 'InkySwot — App',        url: 'https://app.inkyswot.com/' },
      { id: 'catalog',  icon: '◈', label: 'PDP — Admin',           url: 'https://pitchdarkpress.github.io/catalog/admin.html' },
      { id: 'theroom',  icon: '◈', label: 'PDS — The Room',        url: 'https://pitchdarkpress.github.io/pitch-dark-studio-the-room/' },
      { id: 'database', icon: '◈', label: 'PDS — Database',        url: 'https://pitchdarkpress.github.io/pitch-dark-studios-memory/' },
      { id: 'github',   icon: '◈', label: 'GitHub',                url: 'https://github.com/PitchDarkPress' },
      { id: 'gdocs',    icon: '◈', label: 'Google Docs',           url: 'https://docs.google.com/document/u/0/?tgif=d' },
      { id: 'canva',    icon: '◈', label: 'Canva',                 url: 'https://www.canva.com/' },
      { id: 'perchance',icon: '◈', label: 'AI Image Generator',    url: 'https://perchance.org/ai-text-to-image-generator' },
      { id: 'gemini',   icon: '◈', label: 'Google Gemini',         url: 'https://gemini.google.com/' },
      { id: 'chatgpt',  icon: '◈', label: 'ChatGPT',              url: 'https://chatgpt.com/' },
      { id: 'claude',   icon: '◈', label: 'Claude',               url: 'https://claude.ai/new' },
    ]
  },
  {
    id: 'play',
    title: 'Play',
    links: [
      { id: 'youtube',  icon: '▷', label: 'YouTube',    url: 'https://www.youtube.com/' },
      { id: 'amazon',   icon: '▷', label: 'Amazon UK',  url: 'https://www.amazon.co.uk/' },
    ]
  },
  {
    id: 'others',
    title: 'Others',
    links: [
      { id: 'gmail',       icon: '◉', label: 'Gmail',        url: 'https://mail.google.com/mail/u/0/#inbox' },
      { id: 'proauthorist',icon: '◉', label: 'Proauthorist', url: 'https://www.proauthorist.com/' },
    ]
  }
];

function loadSections() {
  try {
    const saved = localStorage.getItem('pds_dashboard');
    return saved ? JSON.parse(saved) : DEFAULT_SECTIONS;
  } catch(e) {
    return DEFAULT_SECTIONS;
  }
}

function saveSections(sections) {
  localStorage.setItem('pds_dashboard', JSON.stringify(sections));
}

let sections = loadSections();
let dragSrcSection = null;
let dragSrcIndex = null;

function render() {
  const container = document.getElementById('sections');
  container.innerHTML = '';

  sections.forEach((section, si) => {
    const sec = document.createElement('div');
    sec.className = 'section';

    const title = document.createElement('div');
    title.className = 'section-title';
    title.textContent = section.title;
    sec.appendChild(title);

    const links = document.createElement('div');
    links.className = 'links';

    section.links.forEach((link, li) => {
      const card = document.createElement('div');
      card.className = 'link-card' + (!link.url ? ' coming-soon' : '');
      card.draggable = !!link.url;
      card.dataset.si = si;
      card.dataset.li = li;

      card.innerHTML = `
        <span class="drag-handle" title="Drag to reorder">⠿</span>
        <span class="icon">${link.icon}</span>
        <span class="label">${link.label}</span>
        ${!link.url ? '<span class="coming">Coming Soon</span>' : ''}
      `;

      if (link.url) {
        card.addEventListener('click', (e) => {
          if (e.target.classList.contains('drag-handle')) return;
          window.open(link.url, '_blank');
        });

        card.addEventListener('dragstart', (e) => {
          dragSrcSection = si;
          dragSrcIndex = li;
          card.classList.add('dragging');
          e.dataTransfer.effectAllowed = 'move';
        });

        card.addEventListener('dragend', () => {
          card.classList.remove('dragging');
          document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
        });

        card.addEventListener('dragover', (e) => {
          e.preventDefault();
          e.dataTransfer.dropEffect = 'move';
          card.classList.add('drag-over');
        });

        card.addEventListener('dragleave', () => {
          card.classList.remove('drag-over');
        });

        card.addEventListener('drop', (e) => {
          e.preventDefault();
          card.classList.remove('drag-over');
          const targetSi = parseInt(card.dataset.si);
          const targetLi = parseInt(card.dataset.li);
          if (dragSrcSection === null || dragSrcIndex === null) return;
          if (dragSrcSection === targetSi && dragSrcIndex === targetLi) return;

          const srcLink = sections[dragSrcSection].links.splice(dragSrcIndex, 1)[0];
          sections[targetSi].links.splice(targetLi, 0, srcLink);
          saveSections(sections);
          render();
        });
      }

      links.appendChild(card);
    });

    sec.appendChild(links);
    container.appendChild(sec);
  });
}

render();
</script>
</body>
</html>
